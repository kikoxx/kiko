# ==========================================
# FUNCTIONAL SETTINGS (Your Custom Bindings)
# ==========================================

# Change Bind Key
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# Set History
set -g history-limit 10000

# Prevent automatic renaming of tabs
set -g allow-rename off

# Use Vim keybindings
set-window-option -g mode-keys vi

# Swap-Windows keybindings
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Terminal Colors (Set to screen-256color for VM stability)
set -g default-terminal "screen-256color"

# Use r to quickly reload tmux settings
unbind r
bind r \
    source-file ~/.tmux.conf \;\
    display 'Reloaded tmux config'

# Same PWD when splitting and new windows
bind c new-window      -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Change Switch Pane Commands
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Copy Mode Setup
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -f -selection clipboard | xclip -i -selection primary"
setw -g mode-keys vi
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -in -selection clipboard"

# Enable Mouse
set -g mouse on

# Ensure window index numbers get reordered on delete
set-option -g renumber-windows on


# ==========================================
# DESIGN TWEAKS (Exact match from blog)
# ==========================================

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'
set -g status-left ''
set -g status-left-length 10

# Refined right status bar
set -g status-right-style 'fg=colour232 bg=yellow bold'
set -g status-right ' %Y-%m-%d ᶠᶸᶜᵏ♥ᵧₒᵤ %H:%M '
set -g default-terminal "screen-256color"
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'
